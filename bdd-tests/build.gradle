// File: bdd-tests/build.gradle
plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
}

sourceSets {
    test {
        resources {
            srcDir 'src/test/java'
            include '**/*.feature'
        }
    }
}
test {
    useJUnitPlatform()
}